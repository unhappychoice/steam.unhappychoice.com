    <script>const rerollLimit = 2;

const readStorage = (key) => {
  try { return JSON.parse(localStorage.getItem(key)); } catch { return null; }
};

const writeStorage = (key, value) => {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* storage unavailable */ }
};

const todayKey = () => new Date().toISOString().slice(0, 10);

const weekKey = () => {
  const date = new Date();
  date.setDate(date.getDate() - ((date.getDay() + 6) % 7));
  return date.toISOString().slice(0, 10);
};

const remainingRerolls = () => rerollLimit - (readStorage(`roulette-rerolls-${todayKey()}`) ?? 0);
const useReroll = () => writeStorage(`roulette-rerolls-${todayKey()}`, rerollLimit - remainingRerolls() + 1);

const weeklyAppid = () => {
  const weekly = readStorage('roulette-weekly');
  return weekly?.week === weekKey() ? weekly.appid : undefined;
};
const setWeeklyAppid = (appid) => writeStorage('roulette-weekly', { appid, week: weekKey() });
</script>
<script>const moodTags = {
  light: ['カジュアル', 'リラックス', 'パズル', 'かわいい', '探し物', '心地よい', '健全', '放置', 'インクリメンタル', 'ミニマリスト', '短時間', '猫', '家族向け', '笑える', 'ポイント＆クリック'],
  challenge: ['高難易度', 'ソウルライク', 'ローグライク', 'ローグライト', 'ローグライクアクション', 'ペースの速い', '弾幕', 'ハックアンドスラッシュ', 'ストラテジー', 'FPS', 'シューティング', 'サバイバル', 'サバイバルホラー']
};
const oppositeMood = { light: 'challenge', challenge: 'light' };
const longPlayTags = ['物語性', 'オープンワールド', 'RPG'];

const countMoodTags = (tags, mood) => tags.filter(tag => moodTags[mood].includes(tag)).length;

const moodScore = ({ tags }, mood) =>
  mood === 'normal' ? 0 : (countMoodTags(tags, mood) - countMoodTags(tags, oppositeMood[mood])) * 2;

const timeScore = ({ completelyHours: hours, achievedCount, goal, tags }, time) => {
  if (time === 'short') return (achievedCount > 0 ? 1 : 0) + (goal.percent >= 30 ? 2 : 0) + (hours && hours <= 10 ? 1 : 0) - (hours >= 50 ? 2 : 0);
  if (time === 'long') return (hours >= 20 ? 2 : 0) + (tags.some(tag => longPlayTags.includes(tag)) ? 1 : 0);

  return 0;
};

const pickCandidate = ({ time, mood, shownAppids }) => {
  const ranked = candidates
    .filter(({ appid }) => !shownAppids.includes(appid))
    .map(candidate => ({ candidate, score: moodScore(candidate, mood) + timeScore(candidate, time) + Math.random() }))
    .sort((a, b) => b.score - a.score)
    .slice(0, 12);

  return ranked[Math.floor(Math.random() * ranked.length)]?.candidate;
};
</script>
<script>const timeFraming = { short: 'まず 30 分だけ', medium: '1〜2 時間だけ', long: 'じっくり腰を据えて' };

const escapeHtml = (text) => String(text ?? '').replace(/[&<>"']/g, char => `&#${char.charCodeAt(0)};`);

const resultHtml = (candidate, { time, isWeekly, rerolls }) => `
  <div style="display: flex; flex-direction: column; align-items: center; gap: 20px;">
    <div style="width: min(100%, 880px); aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; background: #000;">
      ${candidate.trailerUrl
        ? `<video id="result-video" poster="${candidate.capsuleUrl}" muted autoplay loop controls playsinline style="width: 100%; height: 100%; object-fit: cover;"></video>`
        : `<img src="${candidate.capsuleUrl}" style="width: 100%; height: 100%; object-fit: cover;" onerror="this.onerror = null; this.src = '${candidate.headerUrl}';" />`}
    </div>
    <div style="text-align: center;">
      ${isWeekly ? '<div style="margin-bottom: 6px; color: #d4af37; font-size: 13px;">今週の 1 本</div>' : ''}
      <div style="font-size: 30px; color: #f0f0f0;">${escapeHtml(candidate.name)}</div>
      <div style="margin-top: 8px; font-size: 13px;">
        ${candidate.review ? `${escapeHtml(candidate.review.label)}（${candidate.review.percent} % が好評）・` : ''}${candidate.tags.slice(0, 4).map(escapeHtml).join(' / ')}
      </div>
    </div>
    ${progressHtml(candidate)}
    ${goalHtml(candidate, time)}
    <a href="steam://rungameid/${candidate.appid}" class="launch-button">▶ 今すぐ起動</a>
    <div style="display: flex; gap: 12px;">
      <button type="button" class="secondary-button" data-action="reroll" ${rerolls > 0 ? '' : 'disabled'}>引き直す（今日あと ${rerolls} 回）</button>
      <button type="button" class="secondary-button" data-action="weekly" ${isWeekly ? 'disabled' : ''}>${isWeekly ? '今週の 1 本に設定済み' : '今週の 1 本にする'}</button>
      <button type="button" class="secondary-button" data-action="back">条件を変える</button>
    </div>
  </div>`;

const progressHtml = ({ achievedCount, total, difficulty }) => `
    <div style="display: flex; align-items: center; gap: 14px; font-size: 14px;">
      <span style="padding: 2px 10px; border-radius: 10px; background: ${difficulty.color}22; color: ${difficulty.color};">${difficulty.label}</span>
      ${achievedCount > 0
        ? `<span>すでに <b style="color: #d4af37;">${achievedCount} / ${total}</b> 解除済み。続きから始めよう</span>`
        : `<span>まだ手付かず。実績 ${total} 個が待っています</span>`}
    </div>`;

const goalHtml = ({ goal }, time) => `
    <div style="display: flex; align-items: center; gap: 16px; width: min(100%, 640px); padding: 16px 20px; border: 1px solid #d4af3755; border-radius: 10px; background: #1a1a1a;">
      <img src="${goal.iconUrl}" style="flex-shrink: 0; width: 56px; height: 56px; border-radius: 6px; background: #232323;" onerror="this.style.visibility='hidden';" />
      <div style="flex-grow: 1; min-width: 0;">
        <div style="font-size: 12px; color: #d4af37;">今日のゴール・${timeFraming[time]}</div>
        <div style="margin-top: 2px; font-size: 18px; color: #f0f0f0;">${escapeHtml(goal.name)}</div>
        <div style="font-size: 13px;">${escapeHtml(goal.description)}</div>
      </div>
      ${goal.percent === undefined ? '' : `<div style="flex-shrink: 0; text-align: right; font-size: 12px;"><div style="font-size: 20px; color: #e0e0e0;">${goal.percent} %</div>の人が解除済み</div>`}
    </div>`;

const weeklyBannerHtml = (candidate) => `
  <div style="display: flex; align-items: center; gap: 16px; padding: 12px 16px; border: 1px solid #d4af3755; border-radius: 10px; background: #1a1a1a;">
    <img src="${candidate.headerUrl}" style="width: 120px; height: 56px; border-radius: 4px; object-fit: cover;" />
    <div style="flex-grow: 1;">
      <div style="font-size: 12px; color: #d4af37;">今週の 1 本</div>
      <div style="font-size: 16px; color: #f0f0f0;">${escapeHtml(candidate.name)}</div>
    </div>
    <a href="steam://rungameid/${candidate.appid}" class="secondary-button">▶ 続きから</a>
    <button type="button" class="secondary-button" data-action="show-weekly">表示</button>
  </div>`;
</script>
<script>const $questions = document.getElementById('question-screen');
const $shuffle = document.getElementById('shuffle-screen');
const $shuffleImage = document.getElementById('shuffle-image');
const $result = document.getElementById('result-screen');
const $weekly = document.getElementById('weekly-banner');
const rouletteState = { time: 'medium', mood: 'normal', shownAppids: [] };

const findCandidate = (appid) => candidates.find(candidate => candidate.appid === appid);

const showScreen = ($screen) => [$questions, $shuffle, $result].forEach($s => { $s.style.display = $s === $screen ? 'block' : 'none'; });

const selectOption = ($button) => {
  const { question, value } = $button.dataset;
  rouletteState[question] = value;
  document.querySelectorAll(`[data-question="${question}"]`).forEach($b => $b.classList.toggle('is-selected', $b === $button));
};

const playTrailer = (url) => {
  const $video = document.getElementById('result-video');
  if (!$video) return;
  if ($video.canPlayType('application/vnd.apple.mpegurl')) return void ($video.src = url);
  if (!window.Hls?.isSupported()) return;
  const hls = new Hls();
  hls.loadSource(url);
  hls.attachMedia($video);
};

const showResult = (candidate) => withTransition(() => renderResult(candidate));

const renderResult = (candidate) => {
  const isWeekly = weeklyAppid() === candidate.appid;
  $result.innerHTML = resultHtml(candidate, { time: rouletteState.time, isWeekly, rerolls: remainingRerolls() });
  showScreen($result);
  playTrailer(candidate.trailerUrl);
  rouletteState.current = candidate;
};

const shuffleImages = (finish, step = 0) => {
  const delay = 50 + step ** 2 * 1.2;
  if (delay > 320) return finish();
  $shuffleImage.src = candidates[Math.floor(Math.random() * candidates.length)].libraryUrl;
  setTimeout(() => shuffleImages(finish, step + 1), delay);
};

const draw = () => {
  const candidate = pickCandidate(rouletteState);
  if (!candidate) return;
  rouletteState.shownAppids.push(candidate.appid);
  withTransition(() => showScreen($shuffle));
  shuffleImages(() => showResult(candidate));
};

const renderWeeklyBanner = () => {
  const candidate = findCandidate(weeklyAppid());
  $weekly.innerHTML = candidate ? weeklyBannerHtml(candidate) : '';
};

const actions = {
  reroll: () => { useReroll(); draw(); },
  weekly: () => { setWeeklyAppid(rouletteState.current.appid); renderWeeklyBanner(); showResult(rouletteState.current); },
  back: () => withTransition(() => showScreen($questions)),
  'show-weekly': () => showResult(findCandidate(weeklyAppid()))
};

document.querySelectorAll('[data-question]').forEach($button => $button.addEventListener('click', () => selectOption($button)));
document.getElementById('draw-button').addEventListener('click', draw);
document.addEventListener('click', ({ target }) => actions[target.closest('[data-action]')?.dataset.action]?.());
renderWeeklyBanner();
showScreen($questions);
</script>
